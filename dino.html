<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prehistoric Sandbox Lifecycle Simulator</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0914; font-family: system-ui, sans-serif; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; background: linear-gradient(to bottom, #111430, #2a1b40 40%, #572140 70%, #a34c32 100%); }
        #hud-overlay { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(13, 11, 26, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 30px; padding: 10px 25px; display: flex; gap: 40px; font-weight: 700; color: #fff; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); pointer-events: none; }
        .metric-val { color: #fdbb2d; font-family: monospace; font-size: 18px; margin-left: 5px; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="hud-overlay">
            <div>🦕 Dinos: <span id="dino-count" class="metric-val">1</span>/5</div>
            <div>🌳 Canopy Foliage: <span id="tree-count" class="metric-val">0</span></div>
        </div>
        <canvas id="simulationCanvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const dinoCountEl = document.getElementById('dino-count');
        const treeCountEl = document.getElementById('tree-count');

        const MAX_DINOS = 5, TREE_COUNT = 6, GRAVITY = 0.28;
        let dinosaurs = [], trees = [], droppedBranches = [], grassTufts = [], sceneryMountains = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (trees.length === 0) initSimulationWorld();
        }

        function getRandomColorSet() {
            const hues = [35, 140, 190, 270, 310]; // Explicitly populated color channels
            const hue = hues[Math.floor(Math.random() * hues.length)];
            return { base: `hsl(${hue}, 60%, 46%)`, dark: `hsl(${hue}, 62%, 32%)`, light: `hsl(${hue}, 68%, 60%)` };
        }

        function initSimulationWorld() {
            trees = []; droppedBranches = []; grassTufts = []; sceneryMountains = [];
            const groundY = canvas.height - 85;

            for (let i = 0; i < 3; i++) {
                let points = [], step = 45, currentH = groundY - 60 - (i * 50);
                for (let x = 0; x <= canvas.width + step; x += step) {
                    currentH += (Math.random() * 40 - 20);
                    points.push({ x: x, y: Math.min(currentH, groundY - 20) });
                }
                sceneryMountains.push({ points: points, layerColor: `hsl(${240 + i * 15}, 25%, ${12 + i * 4}%)` });
            }

            for (let i = 0; i < TREE_COUNT; i++) {
                let baseTreeX = 120 + (i * (canvas.width - 240) / (TREE_COUNT - 1)) + (Math.random() * 40 - 20);
                let heightVariance = 190 + Math.random() * 90;
                trees.push({
                    x: baseTreeX, y: groundY - heightVariance, trunkH: heightVariance,
                    segments: [
                        { active: true, relX: 0, relY: -20, r: 44, color: '#14532d' },
                        { active: true, relX: -22, relY: 10, r: 38, color: '#166534' },
                        { active: true, relX: 22, relY: 10, r: 38, color: '#15803d' }
                    ],
                    regenTimer: 0
                });
            }

            for (let i = 0; i < 60; i++) {
                grassTufts.push({ x: Math.random() * canvas.width, y: groundY + (Math.random() * 75), blades: 2 + Math.floor(Math.random() * 3), len: 8 + Math.random() * 10 });
            }
        }

        class Brachiosaurus {
            constructor(x, y, scale = 0.42, colors = null) {
                this.x = x; this.y = y; this.scale = scale;
                this.colors = colors || getRandomColorSet();
                this.speed = 0.7 + Math.random() * 0.5;
                this.vx = (Math.random() > 0.5 ? 1 : -1) * this.speed;
                this.facingRight = this.vx > 0;
                this.legCycle = Math.random() * Math.PI * 2;
                this.chewing = false; this.chewTimer = 0;
            }

            update() {
                const groundY = canvas.height - 85;
                this.legCycle += this.chewing ? 0 : 0.07 * (this.speed + 0.6);
                if (this.chewing) {
                    if (--this.chewTimer <= 0) this.chewing = false;
                    return;
                }

                let bestTarget = null, minDist = Infinity, targetType = null, metaData = null;

                droppedBranches.forEach(b => {
                    let d = Math.abs(this.x - b.x);
                    if (d < minDist) { minDist = d; bestTarget = b; targetType = 'branch'; }
                });

                if (!bestTarget) {
                    trees.forEach(t => {
                        let activeNode = t.segments.find(s => s.active);
                        if (activeNode) {
                            let d = Math.abs(this.x - t.x);
                            if (d < minDist) { minDist = d; bestTarget = t; targetType = 'tree'; metaData = activeNode; }
                        }
                    });
                }

                if (bestTarget) {
                    let targetX = bestTarget.x;
                    if (this.x < targetX - 25) { this.vx = this.speed; this.facingRight = true; }
                    else if (this.x > targetX + 25) { this.vx = -this.speed; this.facingRight = false; }
                    else { this.vx = 0; this.munch(targetType, bestTarget, metaData); }
                } else {
                    if (Math.random() < 0.006) { this.vx = (Math.random() > 0.5 ? 1 : -1) * this.speed; this.facingRight = this.vx > 0; }
                    if (this.x < 80) { this.vx = this.speed; this.facingRight = true; }
                    if (this.x > canvas.width - 80) { this.vx = -this.speed; this.facingRight = false; }
                }
                this.x += this.vx;
            }

            munch(type, parentItem, targetSegment) {
                this.chewing = true; this.chewTimer = 55;
                if (type === 'branch') {
                    const idx = droppedBranches.indexOf(parentItem);
                    if (idx > -1) droppedBranches.splice(idx, 1);
                    this.grow(0.16);
                } else if (type === 'tree' && targetSegment) {
                    targetSegment.active = false;
                    parentItem.regenTimer = 400;
                    this.grow(0.08);
                }
            }

            grow(amount) {
                this.scale += amount;
                if (this.scale >= 1.0) handlePopulationSplit(this);
            }
            drawInverseKinematicLeg(isFront, phaseOffset) {
                const s = this.scale;
                const rootX = isFront ? (26 * s) : (-24 * s);
                const rootY = -12 * s;
                const segmentLength = 22 * s;
                const cycle = Math.sin(this.legCycle + phaseOffset);
                const rootAngle = (isFront ? 0.08 : -0.05) + cycle * 0.32;
                const kneeAngle = (Math.cos(this.legCycle + phaseOffset) + 0.9) * 0.45;

                const midX = rootX + Math.sin(rootAngle) * segmentLength;
                const midY = rootY + Math.cos(rootAngle) * segmentLength;
                const baseFootX = midX + Math.sin(rootAngle - kneeAngle) * segmentLength;
                const baseFootY = midY + Math.cos(rootAngle - kneeAngle) * segmentLength;

                ctx.lineWidth = 8.5 * s;
                ctx.lineJoin = "round"; ctx.lineCap = "round";
                ctx.beginPath(); ctx.moveTo(rootX, rootY); ctx.lineTo(midX, midY); ctx.lineTo(baseFootX, baseFootY); ctx.stroke();

                ctx.fillStyle = this.colors.dark;
                ctx.beginPath(); ctx.arc(baseFootX, baseFootY, 4.5 * s, 0, Math.PI, true); ctx.fill();
            }

            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                if (!this.facingRight) ctx.scale(-1, 1);
                const s = this.scale;

                ctx.strokeStyle = this.colors.dark;
                this.drawInverseKinematicLeg(false, Math.PI);
                this.drawInverseKinematicLeg(true, 0);

                ctx.fillStyle = this.colors.base; ctx.strokeStyle = this.colors.dark; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.moveTo(-40 * s, -18 * s);
                ctx.bezierCurveTo(-78 * s, -22 * s, -98 * s, 5 * s, -105 * s, 24 * s);
                ctx.bezierCurveTo(-90 * s, 12 * s, -64 * s, -1 * s, -40 * s, -4 * s);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                ctx.beginPath(); ctx.ellipse(0, -15 * s, 48 * s, 26 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
                ctx.beginPath(); ctx.ellipse(0, -11 * s, 46 * s, 21 * s, 0, 0, Math.PI); ctx.fill();

                ctx.strokeStyle = this.colors.base;
                this.drawInverseKinematicLeg(false, 0);
                this.drawInverseKinematicLeg(true, Math.PI);

                ctx.fillStyle = this.colors.base; ctx.strokeStyle = this.colors.dark;
                ctx.beginPath(); ctx.moveTo(30 * s, -22 * s);
                ctx.bezierCurveTo(66 * s, -68 * s, 66 * s, -98 * s, 50 * s, -120 * s); 
                let mouthGap = (this.chewing && Math.floor(this.chewTimer / 4) % 2 === 0) ? 6 * s : 0;
                ctx.lineTo(75 * s, -125 * s + mouthGap); ctx.lineTo(75 * s, -110 * s);
                ctx.bezierCurveTo(54 * s, -88 * s, 46 * s, -62 * s, 40 * s, -15 * s);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1.8 * s;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath(); ctx.moveTo(44 * s + i*4*s, -42 * s - i*16*s); ctx.lineTo(51 * s + i*4*s, -39 * s - i*16*s); ctx.stroke();
                }

                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(58 * s, -116 * s, 3.8 * s, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(59 * s, -116 * s, 2 * s, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
        }

        function handlePopulationSplit(parent) {
            const idx = dinosaurs.indexOf(parent);
            if (idx > -1) {
                dinosaurs.splice(idx, 1);
                if (dinosaurs.length + 2 <= MAX_DINOS) {
                    dinosaurs.push(new Brachiosaurus(parent.x - 35, parent.y, 0.40));
                    dinosaurs.push(new Brachiosaurus(parent.x + 35, parent.y, 0.40));
                } else if (dinosaurs.length < MAX_DINOS) {
                    dinosaurs.push(new Brachiosaurus(parent.x, parent.y, 0.40));
                }
            }
        }

        window.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            droppedBranches.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, vy: 0, isGrounded: false });
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        dinosaurs.push(new Brachiosaurus(canvas.width / 3, canvas.height - 85, 0.46));

        function loop() {
            const groundLineY = canvas.height - 85;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            sceneryMountains.forEach(m => {
                ctx.fillStyle = m.layerColor; ctx.beginPath(); ctx.moveTo(0, canvas.height);
                m.points.forEach((p) => ctx.lineTo(p.x, p.y));
                ctx.lineTo(canvas.width, canvas.height); ctx.closePath(); ctx.fill();
            });

            ctx.fillStyle = '#164e63'; ctx.fillRect(0, groundLineY, canvas.width, 85);
            ctx.fillStyle = '#155e75'; ctx.fillRect(0, groundLineY, canvas.width, 18);

            ctx.fillStyle = '#0e7490';
            grassTufts.forEach(g => {
                ctx.beginPath(); ctx.moveTo(g.x, g.y);
                for (let j = 0; j < g.blades; j++) { ctx.lineTo(g.x - 4 + j * 4, g.y - g.len); ctx.lineTo(g.x + 2 + j * 2, g.y - g.len / 3); }
                ctx.closePath(); ctx.fill();
            });

            let activeCanopies = 0;
            trees.forEach(t => {
                if (t.regenTimer > 0 && --t.regenTimer === 0) t.segments.forEach(s => s.active = true);
                ctx.fillStyle = '#292524'; ctx.fillRect(t.x - 14, t.y, 28, groundLineY - t.y);
                ctx.fillStyle = '#1c1917'; ctx.fillRect(t.x + 2, t.y, 12, groundLineY - t.y);

                t.segments.forEach(s => {
                    if (s.active) {
                        activeCanopies++;
                        let cx = t.x + s.relX, cy = t.y + s.relY;
                        ctx.fillStyle = '#064e3b'; ctx.beginPath(); ctx.arc(cx, cy, s.r, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(cx - 5, cy - 5, s.r * 0.85, 0, Math.PI * 2); ctx.fill();
                    }
                });
            });

            droppedBranches.forEach(b => {
                if (!b.isGrounded) {
                    b.vy += GRAVITY; b.y += b.vy;
                    if (b.y >= groundLineY + 10) { b.y = groundLineY + 10; b.vy = 0; b.isGrounded = true; }
                }
                ctx.strokeStyle = '#44403c'; ctx.lineWidth = 5.5;
                ctx.beginPath(); ctx.moveTo(b.x - 22, b.y); ctx.lineTo(b.x + 22, b.y); ctx.stroke();
                ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(b.x - 10, b.y - 7, 10, 0, Math.PI * 2); ctx.arc(b.x + 8, b.y - 5, 10, 0, Math.PI * 2); ctx.arc(b.x, b.y - 12, 8, 0, Math.PI * 2); ctx.fill();
            });

            dinosaurs.forEach(dino => { dino.y = groundLineY + 12; dino.update(); dino.draw(); });
            dinoCountEl.textContent = dinosaurs.length; treeCountEl.textContent = activeCanopies;
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
