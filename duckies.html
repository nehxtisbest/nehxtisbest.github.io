<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Rubber Ducky Ecosystem Sandbox</title> 
<style> 
* { box-sizing: border-box; margin: 0; padding: 0; } 
body, html { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(to bottom, #f0fdf4, #dcfce7); font-family: system-ui, -apple-system, sans-serif; user-select: none; touch-action: none; } 
canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; } 
.ui-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #166534; text-align: center; pointer-events: none; font-weight: bold; font-size: 16px; text-shadow: 0 1px 2px rgba(255,255,255,0.8); z-index: 10; } 
</style> 
</head> 
<body> 
<div class="ui-overlay">Tap the Pond to Drop Bread Food! 🍞🌾</div> 
<canvas id="ecoSandbox"></canvas> 
<script> 
const canvas = document.getElementById('ecoSandbox'); 
const ctx = canvas.getContext('2d'); 
let ducks = [], crocodiles = [], turtles = [], seagulls = [], foodList = []; 
let waterLevel = 0, waveOffset = 0; 
const POPULATION_CAP = 5; 

function resize() { 
    canvas.width = window.innerWidth; canvas.height = window.innerHeight; 
    waterLevel = canvas.height * 0.65; 
} 
window.addEventListener('resize', resize); resize(); 

function getClosestFood(obj) {
    if (foodList.length === 0) return null;
    let closest = foodList[0], minDist = Infinity;
    foodList.forEach(f => {
        let dist = Math.hypot(f.x - obj.x, f.y - obj.y);
        if (dist < minDist) { minDist = dist; closest = f; }
    });
    return { food: closest, dist: minDist };
}

class Food { 
    constructor(x, y) { this.x = x; this.y = y; this.radius = 6; this.vy = 0; this.gravity = 0.2; this.isEaten = false; } 
    update() { 
        this.vy += this.gravity; 
        const currentWaterY = waterLevel + Math.sin((this.x * 0.015) + waveOffset) * 15; 
        if (this.y > currentWaterY) { this.vy -= 0.25; this.vy *= 0.85; this.y += this.vy; } 
        else { this.y += this.vy; } 
    } 
    draw() { 
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = '#b45309'; ctx.fill(); 
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius - 1.5, 0, Math.PI * 2); ctx.fillStyle = '#fde68a'; ctx.fill(); 
    } 
} 

class Ducky { 
    constructor(x, y, radius = 16) { 
        this.x = x; this.y = y; this.radius = radius; this.vx = (Math.random() - 0.5) * 4; this.vy = 0; this.gravity = 0.35; this.bounce = 0.6; this.angle = 0; this.va = 0; 
    } 
    update() { 
        this.vy += this.gravity; 
        const currentWaterY = waterLevel + Math.sin((this.x * 0.015) + waveOffset) * 15; 
        if (this.y + this.radius > currentWaterY) { 
            const depth = (this.y + this.radius) - currentWaterY; 
            this.vy -= depth * 0.035; this.vy *= 0.85; 
            let target = getClosestFood(this);
            if (target) { 
                if (target.food.x > this.x) this.vx += 0.15; else this.vx -= 0.15; 
                if (target.dist < this.radius + target.food.radius) { target.food.isEaten = true; this.grow(); } 
            } else { this.vx += (Math.random() - 0.5) * 0.05; } 
            this.vx *= 0.95; this.va += (this.vx * 0.01 - this.angle) * 0.1; 
        } else { this.va *= 0.98; } 
        this.x += this.vx; this.y += this.vy; this.angle += this.va; this.va *= 0.92; 
        if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -this.bounce; } 
        if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -this.bounce; } 
        if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -this.bounce; } 
    } 
    grow() { this.radius += 3; if (this.radius >= 42) { this.radius = 22; spawnBaby(this.x - 10, this.y - 10); spawnBaby(this.x + 10, this.y - 10); } } 
    draw() { 
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); const scale = this.radius / 20; 
        ctx.beginPath(); ctx.ellipse(0, 4 * scale, 18 * scale, 13 * scale, 0, 0, Math.PI * 2); ctx.fillStyle = '#facc15'; ctx.fill(); ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 1.5; ctx.stroke(); 
        ctx.beginPath(); ctx.ellipse(-10 * scale, -2 * scale, 6 * scale, 8 * scale, Math.PI / 4, 0, Math.PI * 2); ctx.fillStyle = '#facc15'; ctx.fill(); ctx.stroke(); 
        ctx.beginPath(); ctx.arc(10 * scale, -8 * scale, 9 * scale, 0, Math.PI * 2); ctx.fillStyle = '#facc15'; ctx.fill(); ctx.stroke(); 
        ctx.beginPath(); ctx.ellipse(18 * scale, -8 * scale, 6 * scale, 3 * scale, 0, 0, Math.PI * 2); ctx.fillStyle = '#f97316'; ctx.fill(); ctx.stroke(); 
        ctx.beginPath(); ctx.arc(11 * scale, -10 * scale, 1.5 * scale, 0, Math.PI * 2); ctx.fillStyle = '#0f172a'; ctx.fill(); ctx.restore(); 
    } 
} 

class Seagull { 
    constructor(x, y) { 
        this.x = x; this.y = y; this.vx = (Math.random() > 0.5 ? 1 : -1) * (1.8 + Math.random() * 1.2); this.wingOffset = Math.random() * Math.PI * 2; 
    } 
    update() { 
        this.wingOffset += 0.15; 
        this.x += this.vx; this.y += Math.sin(this.wingOffset) * 0.4; 
        if (this.x < -50) this.x = canvas.width + 50; 
        if (this.x > canvas.width + 50) this.x = -50; 
    } 
    draw() { 
        ctx.save(); ctx.translate(this.x, this.y); ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.beginPath(); 
        const wingY = Math.sin(this.wingOffset) * 8; ctx.moveTo(-14, wingY); ctx.quadraticCurveTo(0, -8, 0, 0); ctx.quadraticCurveTo(0, -8, 14, wingY); ctx.stroke(); ctx.restore(); 
    } 
} 
class Crocodile { 
    constructor(x, y, radius = 22) { 
        this.x = x; this.y = y; this.radius = radius; this.vx = (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 0.8); 
    } 
    update() { 
        const currentWaterY = waterLevel + Math.sin((this.x * 0.015) + waveOffset) * 15; 
        if (this.y < currentWaterY + 40) this.y = currentWaterY + 40; 
        if (this.y > canvas.height - 30) this.y = canvas.height - 30; 
        let target = getClosestFood(this);
        if (target) { 
            let dx = target.food.x - this.x, dy = target.food.y - this.y, mag = Math.hypot(dx, dy); 
            if (mag > 0) { this.x += (dx / mag) * 2.2; this.y += (dy / mag) * 1.5; } 
            if (target.dist < this.radius + target.food.radius) { target.food.isEaten = true; this.grow(); } 
        } else { this.x += this.vx; this.y += Math.sin(this.x * 0.02) * 0.3; } 
        if (this.x < -40) { this.x = -40; this.vx *= -1; } 
        if (this.x > canvas.width + 40) { this.x = canvas.width + 40; this.vx *= -1; } 
    } 
    grow() { 
        this.radius += 4; 
        if (this.radius >= 50) { 
            this.radius = 22; 
            crocodiles.push(new Crocodile(this.x - 20, this.y, 12)); 
            crocodiles.push(new Crocodile(this.x + 20, this.y, 12)); 
        } 
    }
    draw() { 
        ctx.save(); ctx.translate(this.x, this.y); 
        if (this.vx < 0) ctx.scale(-1, 1);
        const scale = this.radius / 22; ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1.5; 
        ctx.beginPath(); ctx.moveTo(-35 * scale, 4 * scale); ctx.lineTo(-20 * scale, -2 * scale); ctx.lineTo(-20 * scale, 6 * scale); ctx.closePath(); ctx.fillStyle = '#166534'; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 0, 26 * scale, 12 * scale, 0, 0, Math.PI * 2); ctx.fillStyle = '#15803d'; ctx.fill(); ctx.stroke(); 
        ctx.fillStyle = '#14532d';
        for (let i = -15; i <= 15; i += 8) { ctx.beginPath(); ctx.arc(i * scale, -12 * scale, 3 * scale, 0, Math.PI, true); ctx.fill(); }
        ctx.beginPath(); ctx.ellipse(28 * scale, -2 * scale, 14 * scale, 6 * scale, 0, 0, Math.PI * 2); ctx.fillStyle = '#16a34a'; ctx.fill(); ctx.stroke(); 
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(24 * scale, 2 * scale); ctx.lineTo(27 * scale, -1 * scale); ctx.lineTo(30 * scale, 2 * scale); ctx.lineTo(33 * scale, -1 * scale); ctx.lineTo(36 * scale, 2 * scale); ctx.fill();
        ctx.beginPath(); ctx.arc(16 * scale, -6 * scale, 3 * scale, 0, Math.PI * 2); ctx.fillStyle = '#facc15'; ctx.fill();
        ctx.beginPath(); ctx.arc(16 * scale, -6 * scale, 1 * scale, 0, Math.PI * 2); ctx.fillStyle = '#000000'; ctx.fill();
        ctx.restore(); 
    } 
} 

class Turtle { 
    constructor(x, y, radius = 14) { 
        this.x = x; this.y = y; this.radius = radius; this.vx = (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.6); this.swimCycle = Math.random() * Math.PI * 2;
    } 
    update() { 
        this.swimCycle += 0.05; const currentWaterY = waterLevel + Math.sin((this.x * 0.015) + waveOffset) * 15; 
        if (this.y < currentWaterY + 30) this.y = currentWaterY + 30; 
        if (this.y > canvas.height - 30) this.y = canvas.height - 30; 
        let target = getClosestFood(this);
        if (target) { 
            let dx = target.food.x - this.x, dy = target.food.y - this.y, mag = Math.hypot(dx, dy); 
            if (mag > 0) { this.x += (dx / mag) * 1.5; this.y += (dy / mag) * 1.0; } 
            if (target.dist < this.radius + target.food.radius) { target.food.isEaten = true; this.grow(); } 
        } else { this.x += this.vx; this.y += Math.cos(this.x * 0.03) * 0.2; } 
        if (this.x < -30) { this.x = -30; this.vx *= -1; } 
        if (this.x > canvas.width + 30) { this.x = canvas.width + 30; this.vx *= -1; } 
    } 
    grow() { 
        this.radius += 3; 
        if (this.radius >= 35) { 
            this.radius = 14; 
            turtles.push(new Turtle(this.x - 15, this.y, 8)); 
            turtles.push(new Turtle(this.x + 15, this.y, 8)); 
        } 
    }
    draw() { 
        ctx.save(); ctx.translate(this.x, this.y); 
        if (this.vx < 0) ctx.scale(-1, 1);
        const scale = this.radius / 14; ctx.strokeStyle = '#365314'; ctx.lineWidth = 1.5; 
        let flipAngle = Math.sin(this.swimCycle) * 0.4;
        ctx.save(); ctx.translate(8 * scale, 8 * scale); ctx.rotate(flipAngle); ctx.beginPath(); ctx.ellipse(0, 0, 10 * scale, 4 * scale, Math.PI/4, 0, Math.PI*2); ctx.fillStyle = '#65a30d'; ctx.fill(); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.translate(-8 * scale, 8 * scale); ctx.rotate(-flipAngle); ctx.beginPath(); ctx.ellipse(0, 0, 8 * scale, 3 * scale, -Math.PI/4, 0, Math.PI*2); ctx.fillStyle = '#65a30d'; ctx.fill(); ctx.stroke(); ctx.restore();
        ctx.beginPath(); ctx.arc(0, 0, 16 * scale, 0, Math.PI * 2); ctx.fillStyle = '#4d7c0f'; ctx.fill(); ctx.stroke(); 
        ctx.beginPath(); ctx.arc(0, 0, 9 * scale, 0, Math.PI * 2); ctx.stroke();
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) { ctx.beginPath(); ctx.moveTo(Math.cos(a)*9*scale, Math.sin(a)*9*scale); ctx.lineTo(Math.cos(a)*16*scale, Math.sin(a)*16*scale); ctx.stroke(); }
        ctx.beginPath(); ctx.arc(20 * scale, -3 * scale, 6 * scale, 0, Math.PI * 2); ctx.fillStyle = '#65a30d'; ctx.fill(); ctx.stroke(); 
        ctx.beginPath(); ctx.arc(22 * scale, -4 * scale, 1 * scale, 0, Math.PI * 2); ctx.fillStyle = '#000000'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-15 * scale, 0); ctx.lineTo(-21 * scale, 2 * scale); ctx.lineTo(-15 * scale, 4 * scale); ctx.fillStyle = '#65a30d'; ctx.fill(); ctx.stroke();
        ctx.restore(); 
    } 
} 

function checkCollisions() { 
    for (let i = 0; i < ducks.length; i++) { 
        for (let j = i + 1; j < ducks.length; j++) { 
            let d1 = ducks[i], d2 = ducks[j], dx = d2.x - d1.x, dy = d2.y - d1.y, distance = Math.hypot(dx, dy), minDist = d1.radius + d2.radius; 
            if (distance < minDist) { 
                let overlap = minDist - distance, nx = dx / distance, ny = dy / distance; 
                d1.x -= nx * overlap * 0.5; d1.y -= ny * overlap * 0.5; d2.x += nx * overlap * 0.5; d2.y += ny * overlap * 0.5; 
            } 
        } 
    } 
} 

function spawnBaby(x, y) { ducks.push(new Ducky(x, y, 10)); if (ducks.length > POPULATION_CAP) ducks.shift(); } 
function dropFood(clientX, clientY) { foodList.push(new Food(clientX, clientY)); } 

ducks.push(new Ducky(window.innerWidth * 0.25, window.innerHeight * 0.4, 20)); 
ducks.push(new Ducky(window.innerWidth * 0.50, window.innerHeight * 0.4, 20)); 
ducks.push(new Ducky(window.innerWidth * 0.75, window.innerHeight * 0.4, 20)); 

crocodiles.push(new Crocodile(Math.random() * window.innerWidth, window.innerHeight * 0.8)); 
turtles.push(new Turtle(Math.random() * window.innerWidth, window.innerHeight * 0.75)); 

for (let i = 0; i < 3; i++) seagulls.push(new Seagull(Math.random() * window.innerWidth, 50 + Math.random() * 50)); 

window.addEventListener('mousedown', (e) => dropFood(e.clientX, e.clientY)); 
window.addEventListener('touchstart', (e) => { if (e.touches && e.touches.length > 0) dropFood(e.touches[0].clientX, e.touches[0].clientY); }); 

function loop() { 
    ctx.clearRect(0, 0, canvas.width, canvas.height); waveOffset += 0.03; foodList = foodList.filter(f => !f.isEaten); 
    crocodiles.forEach(c => { c.update(); c.draw(); }); 
    turtles.forEach(t => { t.update(); t.draw(); }); 
    foodList.forEach(f => { f.update(); f.draw(); }); 
    checkCollisions(); 
    ducks.forEach(duck => { duck.update(); duck.draw(); }); 
    ctx.beginPath(); ctx.moveTo(0, canvas.height); ctx.lineTo(0, waterLevel); 
    for (let x = 0; x <= canvas.width; x += 10) { const y = waterLevel + Math.sin((x * 0.015) + waveOffset) * 15; ctx.lineTo(x, y); } 
    ctx.lineTo(canvas.width, canvas.height); ctx.closePath(); ctx.fillStyle = 'rgba(56, 189, 248, 0.55)'; ctx.fill(); 
    seagulls.forEach(s => { s.update(); s.draw(); }); 
    requestAnimationFrame(loop); 
} 
loop(); 
</script> 
</body> 
</html>
