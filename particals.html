<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Particle Sandbox</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b16;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            pointer-events: none;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="instructions">Click and Drag to Paint with Magic Particles</div>
    <canvas id="sandbox"></canvas>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let isDrawing = false;
        let hue = 0;

        // Automatically fit the screen
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 6 + 2;
                
                // Physics vectors (speed and angle)
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.hue = hue;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005; // Fade rate
                this.gravity = 0.05; // Soft downward drift
            }

            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;

                // Bounce mechanics for screen boundaries
                if (this.x - this.size < 0 || this.x + this.size > canvas.width) {
                    this.vx *= -0.8;
                    this.x = this.x - this.size < 0 ? this.size : canvas.width - this.size;
                }
                if (this.y - this.size < 0 || this.y + this.size > canvas.height) {
                    this.vy *= -0.8;
                    this.y = this.y - this.size < 0 ? this.size : canvas.height - this.size;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                // Color and Neon Glow
                ctx.fillStyle = `hsl(${this.hue}, 100%, 65%)`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
                
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnParticles(x, y) {
            // Adjust density based on preference
            for (let i = 0; i < 4; i++) {
                particles.push(new Particle(x, y, hue));
            }
            // Cycle colors smoothly across the spectrum
            hue = (hue + 2) % 360;
        }

        // Mouse Event Listeners
        window.addEventListener('mousedown', (e) => {
            isDrawing = true;
            spawnParticles(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDrawing) spawnParticles(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', () => isDrawing = false);

        // Mobile / Touchscreen Support
        window.addEventListener('touchstart', (e) => {
            isDrawing = true;
            spawnParticles(e.touches[0].clientX, e.touches[0].clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if (isDrawing) {
                e.preventDefault(); // Prevents mobile screen bouncing while dragging
                spawnParticles(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchend', () => isDrawing = false);

        // Core Animation loop
        function animate() {
            // Draw a slightly transparent black overlay instead of clearing completely.
            // This creates the gorgeous glowing neon motion-trail effect.
            ctx.fillStyle = 'rgba(11, 11, 22, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                // Remove dead particles to protect system memory
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
