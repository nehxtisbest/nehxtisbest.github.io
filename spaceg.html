<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Arcade</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050510; font-family: sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; background: radial-gradient(circle, #0f0a25, #02020a); }
        #ui { position: absolute; top: 15px; left: 15px; color: #00ffff; font-size: 22px; font-weight: bold; pointer-events: none; text-shadow: 0 0 8px #00ffff; }
        #hint { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 13px; text-align: center; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span> | Shields: <span id="ships">3000</span></div>
    <div id="hint">Drag ship to slide & aim 360°! Click the big star to morph it!</div>
    <canvas id="cvs"></canvas>

    <script>
    const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
    let W = cvs.width = window.innerWidth, H = cvs.height = window.innerHeight;
    window.onresize = () => { W = cvs.width = window.innerWidth; H = cvs.height = window.innerHeight; };

    let score = 0, shields = 3000, audioCtx = null;
    const lasers = [], enemies = [], particles = [], colors = ['#ff0055', '#00ffcc', '#ffcc00', '#ff00ff', '#33ff00', '#00e5ff'];
    const stars = Array.from({length: 60}, () => ({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2, sp: Math.random()*0.5+0.1 }));
    const shootingStars = [];

    const ship = { x: W/2, y: H*0.7, r: 15, a: -Math.PI/2, drag: false, lastX: W/2, lastY: H*0.7, t: 0 };
    const bigStar = { x: W*0.8, y: 100, r: 35, c: '#ffcc00', p: 5, targetP: 5, pulse: 0 };
    const starShapes = [4, 5, 6, 8, 10]; // Clean array fix

    function sound(f, type, d, v) {
        if (!audioCtx) return;
        try {
            let o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);
        } catch(e){}
    }
    function getPos(e) {
        let t = e.touches ? e.touches[0] : e;
        return { x: t.clientX, y: t.clientY };
    }

    function inputStart(e) {
        if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        let p = getPos(e), dStar = Math.hypot(p.x - bigStar.x, p.y - bigStar.y);
        if(dStar < bigStar.r + 15) {
            bigStar.c = colors[Math.floor(Math.random()*colors.length)];
            bigStar.targetP = starShapes[Math.floor(Math.random()*starShapes.length)];
            sound(580, 'sine', 0.4, 0.1);
            for(let i=0; i<12; i++) particles.push({x:bigStar.x, y:bigStar.y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, c:bigStar.c, a:1});
            return;
        }
        if(Math.hypot(p.x - ship.x, p.y - ship.y) < ship.r * 4) { ship.drag = true; ship.lastX = p.x; ship.lastY = p.y; }
    }

    function inputMove(e) {
        if(!ship.drag) return;
        let p = getPos(e), dx = p.x - ship.lastX, dy = p.y - ship.lastY;
        if(Math.hypot(dx, dy) > 2) ship.a = Math.atan2(dy, dx);
        ship.x = Math.max(ship.r, Math.min(W - ship.r, p.x));
        ship.y = Math.max(ship.r, Math.min(H - ship.r, p.y));
        ship.lastX = ship.x; ship.lastY = ship.y;
    }

    window.addEventListener('mousedown', inputStart); window.addEventListener('mousemove', inputMove); window.addEventListener('mouseup', () => ship.drag = false);
    window.addEventListener('touchstart', inputStart, {passive:false}); window.addEventListener('touchmove', inputMove, {passive:false}); window.addEventListener('touchend', () => ship.drag = false);

    function drawPolyStar(cx, cy, spikes, outer, inner, c) {
        let rot = Math.PI/2*3, step = Math.PI/spikes;
        ctx.save(); ctx.shadowBlur = 15; ctx.shadowColor = c; ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(cx, cy - outer);
        for(let i=0; i<spikes; i++) {
            ctx.lineTo(cx + Math.cos(rot)*outer, cy + Math.sin(rot)*outer); rot += step;
            ctx.lineTo(cx + Math.cos(rot)*inner, cy + Math.sin(rot)*inner); rot += step;
        }
        ctx.closePath(); ctx.fill(); ctx.restore();
    }

    function loop() {
        ctx.clearRect(0, 0, W, H);
        stars.forEach(s => { ctx.fillStyle='#fff'; ctx.fillRect(s.x, s.y, s.s, s.s); s.y += s.sp; if(s.y > H) s.y = 0; });

        if(Math.random() < 0.015) shootingStars.push({x: Math.random()*W, y: -10, len: Math.random()*60+30, v: Math.random()*6+5, c: colors[Math.floor(Math.random()*colors.length)]});
        for(let i=shootingStars.length-1; i>=0; i--) {
            let s = shootingStars[i]; ctx.strokeStyle = s.c; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x-s.len, s.y+s.len); ctx.stroke();
            s.x += s.v; s.y += s.v; if(s.y > H || s.x > W) shootingStars.splice(i, 1);
        }

        bigStar.pulse += 0.04; bigStar.p = bigStar.targetP;
        let pRad = bigStar.r + Math.sin(bigStar.pulse)*3;
        drawPolyStar(bigStar.x, bigStar.y, bigStar.p, pRad, pRad/2, bigStar.c);

        ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a + Math.PI/2); ctx.shadowBlur = 12; ctx.shadowColor = '#ff00aa'; ctx.fillStyle = '#ff00aa';
        ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-15, 15); ctx.lineTo(0, 6); ctx.lineTo(15, 15); ctx.closePath(); ctx.fill(); ctx.restore();

        if (ship.drag && ++ship.t % 10 === 0) {
            lasers.push({ x: ship.x, y: ship.y, vx: Math.cos(ship.a)*10, vy: Math.sin(ship.a)*10 }); sound(700, 'sawtooth', 0.1, 0.04);
        }

        for(let i=lasers.length-1; i>=0; i--) {
            let l = lasers[i]; l.x += l.vx; l.y += l.vy; ctx.fillStyle = '#00ffff'; ctx.fillRect(l.x, l.y, 4, 4);
            if(l.x<0 || l.x>W || l.y<0 || l.y>H) lasers.splice(i, 1);
        }

        if(Math.random() < 0.03 && enemies.length < 12) enemies.push({ x: Math.random()*W, y: -30, v: Math.random()*2+1.2, r: 14, c: colors[Math.floor(Math.random()*colors.length)] });
        for(let i=enemies.length-1; i>=0; i--) {
            let e = enemies[i]; e.y += e.v; ctx.fillStyle = e.c; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
            
            if(Math.hypot(e.x - ship.x, e.y - ship.y) < e.r + ship.r) {
                sound(110, 'sawtooth', 0.4, 0.15); shields--; enemies.splice(i, 1);
                document.getElementById('ships').innerText = shields;
                if(shields <= 0) { alert('Game Over! Score: ' + score); score = 0; shields = 3; document.getElementById('ships').innerText = shields; }
                continue;
            }
            for(let j=lasers.length-1; j>=0; j--) {
                if(Math.hypot(e.x - lasers[j].x, e.y - lasers[j].y) < e.r + 4) {
                    sound(110, 'sawtooth', 0.3, 0.1); score += 10; document.getElementById('score').innerText = score;
                    for(let p=0; p<8; p++) particles.push({x:e.x, y:e.y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, c:e.c, a:1});
                    enemies.splice(i, 1); lasers.splice(j, 1); break;
                }
            }
            if(e.y > H + 30) enemies.splice(i, 1);
        }

        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.a -= 0.02; ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
            ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; if(p.a <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(loop);
    }
    loop();
    </script>
</body>
</html>
