<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toddler Balloon Pop!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #e0f7fa, #fff9c4);
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .balloon {
            position: absolute;
            width: 100px;
            height: 125px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1), 2px 5px 10px rgba(0,0,0,0.15);
            animation: floatUp 5s linear forwards;
        }
        .balloon::after {
            content: "▲";
            position: absolute;
            bottom: -10px;
            left: 42px;
            color: inherit;
            font-size: 14px;
        }
        .string {
            position: absolute;
            width: 2px;
            height: 40px;
            background-color: rgba(0,0,0,0.2);
            bottom: -48px;
            left: 49px;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh); }
            100% { transform: translateY(-20vh); }
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 36px;
            color: #ff4081;
            font-weight: bold;
            text-shadow: 2px 2px 0px #fff;
            pointer-events: none;
            z-index: 10;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            position: absolute;
            animation: fall 0.5s ease-out forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(50px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">🎈 Pop: <span id="score">0</span></div>
    </div>

    <script>
        // Web Audio Context for synthesized sound effects without external audio files
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playPopSound() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            // Quick pitch slide up simulates a "pop"
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.08);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        let score = 0;
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const colors = ['#ff1744', '#00e676', '#29b6f6', '#ffea00', '#d500f9', '#ff9100'];

        function createConfetti(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'confetti';
                p.style.backgroundColor = color;
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                // Randomize blast direction
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 40 + 10;
                p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                container.appendChild(p);
                setTimeout(() => p.remove(), 500);
            }
        }

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.backgroundColor = randomColor;
            balloon.style.color = randomColor; // For the triangle tie accent
            
            // Random horizontal placement
            const maxX = window.innerWidth - 120;
            balloon.style.left = Math.random() * Math.max(maxX, 20) + 'px';
            
            // Varied floating speeds perfect for a 3-year-old (not too fast)
            const duration = 4 + Math.random() * 3;
            balloon.style.animationDuration = duration + 's';

            // Add string element
            const string = document.createElement('div');
            string.className = 'string';
            balloon.appendChild(string);

            // Pop interaction for both desktop and mobile tapping
            const popEvent = (e) => {
                e.preventDefault();
                playPopSound();
                
                const rect = balloon.getBoundingClientRect();
                createConfetti(rect.left + 50, rect.top + 60, randomColor);
                
                score++;
                scoreDisplay.textContent = score;
                balloon.remove();
            };

            balloon.addEventListener('touchstart', popEvent, { passive: false });
            balloon.addEventListener('mousedown', popEvent);

            container.appendChild(balloon);

            // Remove balloon automatically once it goes off-screen
            setTimeout(() => {
                if (balloon.parentNode) {
                    balloon.remove();
                }
            }, duration * 1000);
        }

        // Initialize audio on first user click anywhere on screen
        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('touchstart', initAudio, { once: true });

        // Spawn a new balloon every 1.2 seconds
        setInterval(createBalloon, 1200);
    </script>
</body>
</html>
